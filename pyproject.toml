[project]
name = "mtg-draft-ml"
version = "0.0.1"
description = "Generalizing card-encoder models for MTG draft pick prediction"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",            # MPS backend for Apple Silicon (dataset + training)
    "numpy",
    "pandas",                # chunked CSV reading in preprocess
    "pyarrow",               # compact Parquet
    "requests",              # 17lands / Scryfall downloads
    "pyyaml",                # configs
    "tqdm",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers"]  # frozen oracle-text encoder (Phase 1)
hub = ["huggingface_hub"]               # push/pull dataset + checkpoints (DD-007)
distill = ["anthropic", "pydantic"]     # LLM card-quality teacher for cold-start (DD-004)
dev = ["pytest", "ruff", "ipykernel"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Pin torch's CUDA build per platform so `uv` (sync/run/install) is CONSISTENT:
#  - Linux (RunPod): cu124 — matches RunPod host drivers (550+). The DEFAULT PyPI torch wheel is
#    built for the newest CUDA (cu130), which is too new for those drivers -> GPU invisible -> silent
#    crash. Without this pin, `uv run` auto-sync silently reinstalls the cu130 wheel.
#  - macOS (laptop): default PyPI wheel (MPS backend); the cu124 index is Linux-only.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E702 (statements joined with ';') is the project's deliberate compact style — e.g. the
# `v[i] = ...; i += 1` feature-vector layout in cards/features.py and `p = ...; p.write_text(...)`
# fixture setup throughout tests/. Keep it ignored rather than expand those into noisier multi-line.
ignore = ["E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]   # scripts/ are runnable entry points, not tests

[tool.pyright]
# Point the language server at uv's project venv (so torch/numpy/anthropic resolve) and at the
# src/ layout (so first-party `mtg_draft_ml` imports resolve without relying on the editable install).
# Populate the venv with `uv sync --all-extras` (installs the dev/embeddings/hub/distill extras too).
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
